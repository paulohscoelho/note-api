<div class="form-container">
  <div class="form-card">
    <h1>{{ isEditMode ? 'Editar Nota' : 'Nova Nota' }}</h1>

    @if (loading && isEditMode) {
    <p class="info">Carregando nota...</p>
    }

    <form (ngSubmit)="onSubmit()" #noteForm="ngForm">
      <div class="form-group">
        <label for="title">Título</label>
        <input
          id="title"
          type="text"
          name="title"
          [(ngModel)]="title"
          placeholder="Título da nota"
          maxlength="100"
          [disabled]="loading"
          required
        />
      </div>

      <div class="form-group">
        <label for="content">Conteúdo</label>
        <textarea
          id="content"
          name="content"
          [(ngModel)]="content"
          placeholder="Escreva sua nota aqui..."
          rows="8"
          [disabled]="loading"
          required
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="priority">Prioridade</label>
          <select id="priority" name="priority" [(ngModel)]="priority" [disabled]="loading">
            <option [ngValue]="0">Normal</option>
            <option [ngValue]="1">Baixa</option>
            <option [ngValue]="2">Média</option>
            <option [ngValue]="3">Alta</option>
            <option [ngValue]="4">Urgente</option>
            <option [ngValue]="5">Crítica</option>
          </select>
        </div>

        <div class="form-group half">
          <label for="dueDate">Data de Vencimento</label>
          <input
            id="dueDate"
            type="datetime-local"
            name="dueDate"
            [(ngModel)]="dueDate"
            [disabled]="loading"
          />
        </div>
      </div>

      @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
      }

      <div class="form-actions">
        <a routerLink="/notes" class="btn-cancel">Cancelar</a>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Salvando...' : (isEditMode ? 'Salvar' : 'Criar Nota') }}
        </button>
      </div>
    </form>
  </div>
</div>
